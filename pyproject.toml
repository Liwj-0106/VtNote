[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vtnote"
version = "0.1.0"
description = "Local-first video transcript and notes pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=D:/Workspace/Codex/cache/VtNote-pytest"
cache_dir = "D:/Workspace/Codex/cache/VtNote-runtime/pytest-cache"
pythonpath = ["src"]
testpaths = ["tests"]
